<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>An attachment to my letter</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2a426f; /* Faded darker light-blue */
        }
        .container {
            text-align: center;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Button styling */
        #reveal-btn {
            padding: 12px 25px;
            font-size: 18px;
            background-color: #51a3dd; /* Lighter blue for contrast */
            color: white;
            border: 2px solid #51a3dd;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #reveal-btn:hover {
            background-color: #A0B9CF; /* Slightly darker shade on hover */
        }

        /* Video container (hidden initially, will be animated) */
        #video-container {
            display: none;
            opacity: 0;
            margin-top: 20px;
            transition: opacity 1.2s ease-in-out; /* Smooth fade-in */
            width: 100%;
            height: 100%;
        }

        /* Video iframe styling to make it fill the screen */
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
        }

        /* Heart animation for the button */
        .heart {
            animation: heart-beat 1s infinite;
            position: relative;
        }
        .heart:after {
            content: '';
            font-size: 60px;
            position: absolute;
            top: -40px;
            left: -30px;
        }
        @keyframes heart-beat {
            0%, 20% {
                transform: scale(1);
            }
            10% {
                transform: scale(1.2);
            }
        }

        /* Orientation instruction styling */
        #rotate-instruction {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
        }
        .rotate-icon {
            display: block;
            font-size: 40px;
            margin: 10px auto;
            transform: rotate(90deg);
        }

        /* For landscape mode on iPhone */
        @media only screen and (max-width: 1024px) and (orientation: landscape) {
            iframe {
                width: 100vw;
                height: 100vh;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <button id="reveal-btn" class="heart">Hear me yap</button>

    <div id="video-container">
        <iframe id="video-iframe" src="https://drive.google.com/file/d/1zrzGRi-RzgMlCYf-V06PrXSDlgt3BGr4/preview" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <div id="rotate-instruction">
        <span class="rotate-icon">🔄</span>
        Turn me around
    </div>
</div>

<script>
    const revealButton = document.getElementById('reveal-btn');
    const videoContainer = document.getElementById('video-container');
    const videoIframe = document.getElementById('video-iframe');
    const rotateInstruction = document.getElementById('rotate-instruction');
    const isIphone = /iPhone/.test(navigator.userAgent) && !window.MSStream;

    // Reveal video iframe with animation
    revealButton.addEventListener('click', function() {
        revealButton.style.display = 'none'; // Hide button
        videoContainer.style.display = 'block'; // Show video container
        setTimeout(function() {
            videoContainer.style.opacity = 1; // Fade-in animation
        }, 100); // Delay to ensure proper fade-in

        // Automatically request fullscreen if the user clicks the button
        if (videoIframe.requestFullscreen) {
            videoIframe.requestFullscreen();
        } else if (videoIframe.mozRequestFullScreen) { // Firefox
            videoIframe.mozRequestFullScreen();
        } else if (videoIframe.webkitRequestFullscreen) { // Chrome, Safari, and Opera
            videoIframe.webkitRequestFullscreen();
        } else if (videoIframe.msRequestFullscreen) { // IE/Edge
            videoIframe.msRequestFullscreen();
        }
    });

    // Check if the device is an iPhone and show the rotate instruction for portrait mode
function checkOrientation() {
    if (isIphone) {
        if (window.innerWidth < window.innerHeight) {  // In portrait mode
            rotateInstruction.style.display = 'block';
            videoContainer.style.display = 'none';
        } else {  // In landscape mode
            rotateInstruction.style.display = 'none';
            videoContainer.style.display = 'block';  // Automatically show video
            videoContainer.style.opacity = 1;  // Ensure opacity is set to 1
            
            // Automatically request fullscreen when rotated
            if (videoIframe.requestFullscreen) {
                videoIframe.requestFullscreen();
            } else if (videoIframe.mozRequestFullScreen) { // Firefox
                videoIframe.mozRequestFullScreen();
            } else if (videoIframe.webkitRequestFullscreen) { // Chrome, Safari, Opera
                videoIframe.webkitRequestFullscreen();
            } else if (videoIframe.msRequestFullscreen) { // IE/Edge
                videoIframe.msRequestFullscreen();
            }
        }
    }
}


    // Call checkOrientation on load and on orientation change
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', checkOrientation);
    window.onload = checkOrientation;

    // Detect Escape key to exit fullscreen, but keep the video visible
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            // Do not hide the video, just exit fullscreen
            if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement) {
                // If in fullscreen, exit fullscreen
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.mozCancelFullScreen) { // Firefox
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) { // Chrome, Safari, and Opera
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) { // IE/Edge
                    document.msExitFullscreen();
                }
            }
        }
    });
</script>

</body>
</html>
