<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        body {
            background-color: #08375e;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Prevent scrollbars */
        }
        .container {
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }
        h1, h2 {
            margin: 0;
            opacity: 0;
            animation: slideIn 1s forwards;
        }
        h1 {
            animation-delay: 0.5s;
        }
        h2 {
            animation-delay: 1s;
        }
        .spacing {
            margin: 20px 0; /* Space between rows */
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hi, I'm not doing projects anymore</h1>
        <div class="spacing"></div>
        <h2>Contact: me@balazsbiro.com</h2>
    </div>
</body>
</html>
